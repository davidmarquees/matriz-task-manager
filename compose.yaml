# Matriz with Docker Compose (Worksheet 05): PostgreSQL, Mailpit (local mail catcher), backend and frontend.
# Values come from the .env file at the repository root (copy .env.example); no credentials in this file.
#   Whole application:          docker compose up -d --build   -> http://localhost:8088 (MATRIZ_WEB_PORT)
#   Local development services: docker compose up -d db mail   (backend and frontend run outside Docker)
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${MATRIZ_DB_NAME}
      POSTGRES_USER: ${MATRIZ_DB_OWNER_USER}
      POSTGRES_PASSWORD: ${MATRIZ_DB_OWNER_PASSWORD}
      MATRIZ_DB_APP_USER: ${MATRIZ_DB_APP_USER}
      MATRIZ_DB_APP_PASSWORD: ${MATRIZ_DB_APP_PASSWORD}
    ports:
      # Published on this machine only (127.0.0.1), for local development (backend run with ./mvnw);
      # the backend container uses the network
      - "127.0.0.1:${MATRIZ_DB_PORT:-5432}:5432"
    volumes:
      - matriz-db-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [matriz]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mail:
    # Catches every email the backend sends; nothing leaves the machine. Web UI: http://localhost:8025
    image: axllent/mailpit:v1.27
    ports:
      # On this machine only (127.0.0.1)
      - "127.0.0.1:${MATRIZ_MAIL_PORT:-1025}:1025"
      - "127.0.0.1:${MATRIZ_MAIL_UI_PORT:-8025}:8025"
    networks: [matriz]
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    image: matriz-backend:local
    # Each variable listed on purpose (no env_file): the container gets only what the backend uses
    environment:
      MATRIZ_DB_URL: jdbc:postgresql://db:5432/${MATRIZ_DB_NAME}
      MATRIZ_DB_OWNER_USER: ${MATRIZ_DB_OWNER_USER}
      MATRIZ_DB_OWNER_PASSWORD: ${MATRIZ_DB_OWNER_PASSWORD}
      MATRIZ_DB_APP_USER: ${MATRIZ_DB_APP_USER}
      MATRIZ_DB_APP_PASSWORD: ${MATRIZ_DB_APP_PASSWORD}
      MATRIZ_PROFILE: ${MATRIZ_PROFILE:-}
      MATRIZ_COOKIE_SECURE: ${MATRIZ_COOKIE_SECURE:-false}
      MATRIZ_ADMIN_NAME: ${MATRIZ_ADMIN_NAME:-}
      MATRIZ_ADMIN_EMAIL: ${MATRIZ_ADMIN_EMAIL:-}
      MATRIZ_ADMIN_PASSWORD: ${MATRIZ_ADMIN_PASSWORD:-}
      MATRIZ_DEMO_PASSWORD: ${MATRIZ_DEMO_PASSWORD:-}
      MATRIZ_MAIL_HOST: mail
      MATRIZ_MAIL_PORT: "1025"
      MATRIZ_MAIL_USERNAME: ${MATRIZ_MAIL_USERNAME:-}
      MATRIZ_MAIL_PASSWORD: ${MATRIZ_MAIL_PASSWORD:-}
      MATRIZ_MAIL_FROM: ${MATRIZ_MAIL_FROM:-no-reply@example.test}
      MATRIZ_APP_URL: http://localhost:${MATRIZ_WEB_PORT:-8088}
      # Only nginx reaches the backend (no published port), so its X-Forwarded-For can be trusted (README)
      SERVER_FORWARD_HEADERS_STRATEGY: native
    networks: [matriz]
    depends_on:
      db:
        condition: service_healthy
      mail:
        condition: service_started # a mail server that is down must not stop the application (D36)
    restart: unless-stopped
    # Health check: backend/Dockerfile (GET /api/actuator/health)

  frontend:
    build: ./frontend
    image: matriz-frontend:local
    ports:
      - "${MATRIZ_WEB_PORT:-8088}:8080"
    networks: [matriz]
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    # Health check: frontend/Dockerfile (GET /)

networks:
  matriz:

volumes:
  # Data survives "docker compose down"; only "docker compose down -v" deletes it.
  matriz-db-data:
