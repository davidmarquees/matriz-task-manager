# Serves the React build and forwards /api to the backend container (service name "backend" in compose.yaml).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # API: same origin for the browser; the backend keeps its /api context path
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        # Overwrite, never append, what the client sent (README, "Behind a reverse proxy")
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # Hashed build files can be cached for a long time
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-page application: unknown paths load index.html (React Router), never cached
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
