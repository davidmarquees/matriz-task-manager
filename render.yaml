# Render Blueprint for the public course deployment of Matriz (docs/deployment.md).
# Two services on the free plan, deployed from main only after the CI checks pass:
#   matriz-api  backend, Docker web service built from backend/Dockerfile
#   matriz-web  frontend, static site; /api/* is rewritten to matriz-api, so the browser sees one origin
#               (session and CSRF cookies, as with nginx in compose.yaml)
# The database is on Neon (not managed by this file).
# No credentials here: every "sync: false" value is typed in the Render Dashboard when the Blueprint
# is created. If Render gives a service another address (name already taken), update the two URLs below.
services:
  - type: web
    name: matriz-api
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    autoDeployTrigger: checksPass
    # Paths relative to the repository root (Blueprint specification)
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/actuator/health
    envVars:
      # Neon: jdbc:postgresql://<direct host>/<database>?sslmode=require (no user or password in the URL)
      - key: MATRIZ_DB_URL
        sync: false
      - key: MATRIZ_DB_OWNER_USER
        sync: false
      - key: MATRIZ_DB_OWNER_PASSWORD
        sync: false
      - key: MATRIZ_DB_APP_USER
        sync: false
      - key: MATRIZ_DB_APP_PASSWORD
        sync: false
      # Demo accounts, projects and tasks for the presentation (application-demo.yml); keep it set
      - key: MATRIZ_PROFILE
        value: demo
      - key: MATRIZ_DEMO_PASSWORD
        sync: false
      - key: MATRIZ_ADMIN_NAME
        sync: false
      - key: MATRIZ_ADMIN_EMAIL
        sync: false
      - key: MATRIZ_ADMIN_PASSWORD
        sync: false
      # Render serves HTTPS only
      - key: MATRIZ_COOKIE_SECURE
        value: "true"
      # Address of the frontend: link in the reset email and the only origin allowed by CORS
      - key: MATRIZ_APP_URL
        value: https://matriz-web.onrender.com
      - key: MATRIZ_CORS_ALLOWED_ORIGINS
        value: https://matriz-web.onrender.com
      # Client address from the X-Forwarded-For header set by the Render proxy (login rate limit)
      - key: SERVER_FORWARD_HEADERS_STRATEGY
        value: native
      # Free plan: 512 MB of memory for the whole container
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=75 -XX:+UseSerialGC -XX:+ExitOnOutOfMemoryError
      # Reset email (optional). Render free blocks ports 25, 465 and 587: use an SMTP port such as 2525
      - key: MATRIZ_MAIL_HOST
        sync: false
      - key: MATRIZ_MAIL_PORT
        sync: false
      - key: MATRIZ_MAIL_USERNAME
        sync: false
      - key: MATRIZ_MAIL_PASSWORD
        sync: false
      - key: MATRIZ_MAIL_FROM
        sync: false

  - type: web
    name: matriz-web
    runtime: static
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      # Read at build time; the browser calls /api on the same origin (rewrite below)
      - key: VITE_API_URL
        value: /api
      - key: NODE_VERSION
        value: "24"
    routes:
      # Order matters: the API first, then the single-page application (React Router)
      - type: rewrite
        source: /api/*
        destination: https://matriz-api-mjrq.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Same headers as frontend/security-headers.inc (nginx)
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
