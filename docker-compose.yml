# Local development services: PostgreSQL and Mailpit (a local mail catcher for the password reset email).
# Values come from the .env file at the repository root (copy .env.example).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${MATRIZ_DB_NAME}
      POSTGRES_USER: ${MATRIZ_DB_OWNER_USER}
      POSTGRES_PASSWORD: ${MATRIZ_DB_OWNER_PASSWORD}
      MATRIZ_DB_APP_USER: ${MATRIZ_DB_APP_USER}
      MATRIZ_DB_APP_PASSWORD: ${MATRIZ_DB_APP_PASSWORD}
    ports:
      - "${MATRIZ_DB_PORT:-5432}:5432"
    volumes:
      - matriz-db-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mail:
    # Catches every email the backend sends; nothing leaves the machine. Web UI: http://localhost:8025
    image: axllent/mailpit:v1.27
    ports:
      - "${MATRIZ_MAIL_PORT:-1025}:1025"
      - "${MATRIZ_MAIL_UI_PORT:-8025}:8025"

volumes:
  # Data survives "docker compose down"; only "docker compose down -v" deletes it.
  matriz-db-data:
