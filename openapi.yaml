openapi: 3.1.0
info:
  title: Matriz API
  version: 0.2.0
  license:
    name: Proprietary
  summary: REST API of Matriz, a project and task management application (MVP).
  description: |
    Contract for the Worksheet 03 scope (docs/implementation-plan.md, section 6): authentication,
    projects and members, tasks, assignees, comments and the dashboard. Operations outside that scope
    (account administration, password reset and change, preferences, audit and activity log reading)
    are optional (plan decision P9) and will be added here only if that increment is approved.

    Legend: [D] confirmed decision · [A] assumption (to be confirmed) · [P] pending decision.

    Decisions
    - [D] REST + JSON; authentication with a server-side session cookie (docs/architecture.md).
    - [D] Title 3 to 150 characters after trimming, not only spaces; description up to 2,000 (A6, A20).
    - [D] Project name mandatory, up to 100 characters after trimming, not only spaces; description up to
      2,000 (docs/database.md; plan decision C2).
    - [D] Status TODO | IN_PROGRESS | DONE, default TODO; priority LOW | MEDIUM | HIGH, default MEDIUM (A5).
    - [D] 404 when the resource does not exist or the user is not a member of its project, so its
      existence is not revealed (E4); 403 when the user is authenticated but not allowed (e.g. a Member
      editing a project, D10, or the Admin account opening tasks, D11).
    - [D] 400 only for a malformed request (invalid JSON, unknown field, non-numeric id); 422 for well-formed
      JSON that breaks a rule, including a wrong type or null where not allowed. Errors use the Problem Details format (RFC 9457), without internal details (NFR5).
    - [D] 409 for duplicates and conflicting state: version conflict (D25), member already in the project
      (D13), user already assigned to the task (D21, plan decision C1), last Manager (D16). The `code`
      field of the problem tells them apart.
    - [D] Identity always comes from the session: project creator, task creator and comment author are set
      by the backend; clients cannot send them (unknown field, 400).
    - [D] Every write operation records an activity log entry in the same transaction (FR13);
      clients do not send anything for it.
    - [D] Updates use PATCH with only the fields that change, plus the resource's current `version`
      (optimistic locking, D25).
    - [D] Lists of projects and tasks are paginated (`page` from 0, `size` 1 to 100, default 20) and
      return `totalItems`; counts per status are always computed over all the data, not the page
      (plan decision P7).

    Session lifecycle [D]
    1. The client calls `GET /auth/me`. Without a session the answer is 401, and the response sets the
       `XSRF-TOKEN` cookie.
    2. The client calls `POST /auth/login` with the token from that cookie in the `X-XSRF-TOKEN` header.
       On success the server creates a new session (new `JSESSIONID`, HttpOnly) and a new CSRF token.
    3. Every later request sends the session cookie; unsafe requests (POST, PUT, PATCH, DELETE) also send
       `X-XSRF-TOKEN`.
    4. The session ends at `POST /auth/logout` or after 30 minutes of inactivity (A18). Any request
       after that gets 401, and the interface goes to the login page with a "session expired" message.
    5. The account status and project memberships are checked on every request, so a deactivated account
       or a removed member is refused at the next request (D8, D18).

    Assumptions
    - [A] The backend trims names, titles, descriptions and comment bodies before validating and saving.
    - [A] All paths are under the /api prefix.
    - [A] Changing assignees through `/tasks/{taskId}/assignees` does not need nor change the task's
      `version`; `updateTask` with `assigneeIds` replaces the whole list and does.
    - [A] Members are added by email, so a Manager does not need access to the list of all users.

    Error coverage (cases from docs/database.md, section 6)
    - 400: malformed JSON, unknown field, non-numeric id.
    - 401: no session, expired session, deactivated account (D8); wrong credentials or locked account at
      login (D6, D7).
    - 403: not allowed for the account or project role (D9, D10, D11, D23); password change required (D45);
      missing or invalid CSRF token.
    - 404: resource does not exist, user not a member (D17), removed member with an open page (D18),
      former creator (D24), deleted while in use (D26).
    - 409: see above.
    - 415: request body not sent as application/json.
    - 422: field rules (D20), user not eligible (D14, D22), invalid query parameters.
    - 500: unexpected error or database unavailable; nothing saved (D28, D29).
    - Not applicable here: 429.

    Pending decisions
    - [P] Error message texts (translated by the frontend into the user's language, NFR1).
servers:
  - url: http://localhost:8080/api
    description: Local development [A]
security:
  - sessionCookie: []
tags:
  - name: Auth
    description: Log in, log out and read the authenticated user (FR1).
  - name: Projects
    description: Projects visible to the user (FR2, FR4, FR10).
  - name: Members
    description: Project members and project roles (FR3); also the list of users eligible as assignees (FR8).
  - name: Tasks
    description: Tasks of a project (FR5–FR7, FR10).
  - name: Assignees
    description: Assignees of a task (FR8).
  - name: Comments
    description: Comments on a task (FR11).
  - name: Dashboard
    description: Projects of the user with task counts per status (FR9).

paths:
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Log in
      description: |
        Checks email and password and starts a new session. Wrong email, wrong password, a deactivated
        account and a locked account get the same 401 (D6). After 5 failed attempts in a row the account is
        locked for 15 minutes (D7, A17). When `mustChangePassword` is true, every other operation answers
        403 until the password is changed (D45).
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: manager@example.test
              password: example-password
      responses:
        '200':
          description: Logged in. Sets a new `JSESSIONID` cookie and a new `XSRF-TOKEN` cookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/LoginFailed'
        '403':
          $ref: '#/components/responses/Forbidden'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Log out
      description: Ends the current session. Answers 204 also when there is no session.
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Session ended; the session cookie is cleared.
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/me:
    get:
      tags: [Auth]
      operationId: getMe
      summary: Get the authenticated user
      description: |
        Returns the user of the current session. Allowed while a password change is required (D45).
        Without a session the answer is 401 and the `XSRF-TOKEN` cookie is set, so the client can log in.
      responses:
        '200':
          description: The authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /projects:
    get:
      tags: [Projects]
      operationId: listProjects
      summary: List and search projects
      description: |
        Projects the user is a member of (FR4), sorted by name, with the user's role and task counts per
        status. `q` searches the name, case-insensitive, "contains" (plan decision G2). The Admin account
        sees every project, without task counts (Admin sees project names and members only).
      parameters:
        - name: q
          in: query
          required: false
          description: Text to search in the project name; empty means no filter.
          schema:
            type: string
            maxLength: 100
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: One page of projects.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Projects]
      operationId: createProject
      summary: Create a project
      description: |
        Only Manager accounts create projects (FR2, D9). The authenticated user becomes the project's
        creator and its first Manager (A1, A12).
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreateRequest'
            example:
              name: Website redesign
              description: New layout for the public website.
      responses:
        '201':
          description: Project created.
          headers:
            Location:
              description: URL of the new project.
              schema:
                type: string
                example: /api/projects/7
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /projects/{projectId}:
    get:
      tags: [Projects]
      operationId: getProject
      summary: Get a project
      description: Any member of the project can read it; the Admin account too, without task counts.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: The project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [Projects]
      operationId: updateProject
      summary: Update a project
      description: Only the project's Managers (FR2, D10). Only the fields sent are changed; `version` is mandatory.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpdateRequest'
            example:
              version: 2
              name: Website redesign 2027
      responses:
        '200':
          description: Project updated; `version` is incremented when something changed (D43).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Projects]
      operationId: deleteProject
      summary: Delete a project
      description: |
        Only the project's Managers (A10). Deletes, in one transaction, its members, tasks, assignees and
        comments (A11, D29); the activity log entries are kept. The interface asks for confirmation (NFR6).
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Project deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /projects/{projectId}/members:
    get:
      tags: [Members]
      operationId: listMembers
      summary: List the project's members
      description: |
        Active members of the project, sorted by name. It is also the list of users eligible as assignees
        of the project's tasks (FR8, plan decision G3). Readable by members and the Admin account.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: The members.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Member'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Members]
      operationId: addMember
      summary: Add a member to the project
      description: |
        Only the project's Managers (FR3). The user is identified by email; it must be an active account
        that is not the Admin account (D14). A removed member can be added again (D15).
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberAddRequest'
            example:
              email: member@example.test
              projectRole: MEMBER
      responses:
        '201':
          description: Member added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /projects/{projectId}/members/{userId}:
    patch:
      tags: [Members]
      operationId: changeMemberRole
      summary: Promote or demote a member
      description: |
        Only the project's Managers (FR3). Demoting the last Manager is refused (E6, D16).
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberRoleRequest'
            example:
              projectRole: MANAGER
      responses:
        '200':
          description: Role changed (or unchanged when it was already that role).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Members]
      operationId: removeMember
      summary: Remove a member from the project
      description: |
        Only the project's Managers (FR3). Removing the last Manager is refused (E6, D16). The member's
        assignments in the project are removed; the tasks stay (E1). The interface asks for confirmation (NFR6).
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Member removed.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /projects/{projectId}/tasks:
    get:
      tags: [Tasks]
      operationId: listTasks
      summary: List, search and filter the project's tasks
      description: |
        Any member of the project (FR10). `q` searches title and description, case-insensitive,
        "contains". Filters are combined with AND. Sorted by creation date, newest first [A].
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: q
          in: query
          required: false
          description: Text to search in title and description; empty means no filter.
          schema:
            type: string
            maxLength: 150
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/TaskStatus'
        - name: priority
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/TaskPriority'
        - name: assigneeId
          in: query
          required: false
          description: Only tasks assigned to this user.
          schema:
            $ref: '#/components/schemas/Id'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: One page of tasks; an empty `items` list when nothing matches (E3).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Tasks]
      operationId: createTask
      summary: Create a task in a project
      description: |
        Any member of the project (Manager or Member) can create a task (FR5, US3).
        The authenticated user becomes the task creator (`createdBy`).
        Status and priority default to TODO and MEDIUM when omitted.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreateRequest'
            examples:
              minimal:
                summary: Only the mandatory field
                value:
                  title: Fix login error message
              full:
                summary: All fields
                value:
                  title: Write the sprint report
                  description: Summary of the tasks completed this week.
                  status: IN_PROGRESS
                  priority: HIGH
                  dueDate: '2026-12-01'
                  assigneeIds: [2, 3]
      responses:
        '201':
          description: Task created.
          headers:
            Location:
              description: URL of the new task.
              schema:
                type: string
                example: /api/tasks/42
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /tasks/{taskId}:
    get:
      tags: [Tasks]
      operationId: getTask
      summary: Get a task
      description: Any member of the task's project can read it (FR4, FR5).
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: The task.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [Tasks]
      operationId: updateTask
      summary: Update a task
      description: |
        Any member of the task's project can update it, including tasks they did not create (A13).
        Only the fields sent are changed; `version` is mandatory. When sent, `assigneeIds` replaces
        the whole list of assignees. The task cannot be moved to another project (D27).
        The change is recorded in the project's activity log (FR13).
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskUpdateRequest'
            examples:
              changeStatus:
                summary: Move a task to DONE
                value:
                  version: 3
                  status: DONE
              clearDueDate:
                summary: Remove the due date and change the assignees
                value:
                  version: 4
                  dueDate: null
                  assigneeIds: [3]
      responses:
        '200':
          description: Task updated; `version` is incremented when something changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Tasks]
      operationId: deleteTask
      summary: Delete a task
      description: |
        A project Manager or the task's creator (A10, D23). Deletes its assignees and comments (A11).
        The interface asks for confirmation (NFR6).
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Task deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /tasks/{taskId}/assignees:
    post:
      tags: [Assignees]
      operationId: addAssignee
      summary: Assign a user to the task
      description: |
        Any member of the task's project. The user must be an active member of that project (FR8, D22).
        A user already assigned is refused with 409 (D21).
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssigneeAddRequest'
            example:
              userId: 3
      responses:
        '201':
          description: Assigned. Returns the task with its new list of assignees.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /tasks/{taskId}/assignees/{userId}:
    delete:
      tags: [Assignees]
      operationId: removeAssignee
      summary: Remove an assignment
      description: Any member of the task's project. 404 when the user is not assigned to the task.
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Assignment removed.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /tasks/{taskId}/comments:
    get:
      tags: [Comments]
      operationId: listComments
      summary: List the task's comments
      description: Any member of the task's project (FR11). Sorted oldest first; not paginated [A].
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: The comments.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Comment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Comments]
      operationId: addComment
      summary: Add a comment
      description: |
        Any member of the task's project (FR11, US7). Author and date are set by the backend.
        Comments cannot be edited or deleted (A14).
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentCreateRequest'
            example:
              body: I will review this tomorrow.
      responses:
        '201':
          description: Comment added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /dashboard:
    get:
      tags: [Dashboard]
      operationId: getDashboard
      summary: Get the dashboard
      description: |
        All projects the user is a member of (not paginated), sorted by name, each with task counts per
        status, plus totals across them (FR9, E2, wireframe). The Admin account gets 403 (it has no dashboard).
      responses:
        '200':
          description: The dashboard data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: Server-side session cookie (HttpOnly) set at login; expires after 30 minutes of inactivity (A18). See "Session lifecycle" in the API description.

  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    UserId:
      name: userId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    CsrfToken:
      name: X-XSRF-TOKEN
      in: header
      required: true
      description: CSRF token read from the XSRF-TOKEN cookie (Spring Security default).
      schema:
        type: string
    Page:
      name: page
      in: query
      required: false
      description: Page number, starting at 0.
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      required: false
      description: Items per page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  schemas:
    Id:
      type: integer
      format: int64
      minimum: 1
      example: 42

    TaskStatus:
      type: string
      enum: [TODO, IN_PROGRESS, DONE]

    TaskPriority:
      type: string
      enum: [LOW, MEDIUM, HIGH]

    AccountRole:
      type: string
      enum: [ADMIN, MANAGER, MEMBER]

    ProjectRole:
      type: string
      enum: [MANAGER, MEMBER]

    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          type: string
          maxLength: 254
        password:
          type: string
          maxLength: 100

    CurrentUser:
      type: object
      required: [id, name, email, accountRole, mustChangePassword, locale, theme]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
          example: Ana Silva
        email:
          type: string
          example: ana.silva@example.test
        accountRole:
          $ref: '#/components/schemas/AccountRole'
        mustChangePassword:
          type: boolean
          description: When true, the interface shows only the change-password screen (FR1e, D45).
        locale:
          type: string
          enum: [pt-PT, en]
        theme:
          type: string
          enum: [LIGHT, DARK, SYSTEM]

    UserSummary:
      type: object
      required: [id, name, active]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: [string, 'null']
          example: Ana Silva
          description: null when the account was anonymised; the frontend shows "Removed user".
        active:
          type: boolean
          description: false when the account was deactivated; the frontend shows the "left the company" label.

    TaskCounts:
      type: object
      required: [TODO, IN_PROGRESS, DONE]
      description: Number of tasks per status, over all the project's tasks (FR9).
      properties:
        TODO:
          type: integer
          minimum: 0
        IN_PROGRESS:
          type: integer
          minimum: 0
        DONE:
          type: integer
          minimum: 0

    ProjectCreateRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '\S'
          description: Mandatory. Up to 100 characters after trimming; cannot be only spaces.
        description:
          type: [string, 'null']
          maxLength: 2000
          description: Optional. Up to 2,000 characters.

    ProjectUpdateRequest:
      type: object
      required: [version]
      minProperties: 2
      additionalProperties: false
      description: Partial update. At least one field besides `version`. Same rules as on creation.
      properties:
        version:
          type: integer
          minimum: 0
          description: The `version` of the project as last read by the client.
        name:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '\S'
          description: Up to 100 characters after trimming; cannot be only spaces. Cannot be set to null.
        description:
          type: [string, 'null']
          maxLength: 2000
          description: Up to 2,000 characters; null clears it.

    ProjectSummary:
      type: object
      required: [id, name, myRole, memberCount]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
          example: Website redesign
        description:
          type: [string, 'null']
        myRole:
          description: The user's role in the project; null for the Admin account.
          oneOf:
            - $ref: '#/components/schemas/ProjectRole'
            - type: 'null'
        memberCount:
          type: integer
          minimum: 1
        taskCounts:
          description: Omitted for the Admin account.
          $ref: '#/components/schemas/TaskCounts'

    Project:
      allOf:
        - $ref: '#/components/schemas/ProjectSummary'
        - type: object
          required: [createdBy, createdAt, updatedAt, version]
          properties:
            createdBy:
              $ref: '#/components/schemas/UserSummary'
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
            version:
              type: integer
              description: Used for optimistic locking when the project is updated (D25).

    PageInfo:
      type: object
      required: [page, size, totalItems]
      properties:
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
        totalItems:
          type: integer
          minimum: 0
          description: Number of items matching the query, over all pages.

    ProjectPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/ProjectSummary'

    Member:
      type: object
      required: [user, projectRole, addedAt]
      properties:
        user:
          $ref: '#/components/schemas/UserSummary'
        projectRole:
          $ref: '#/components/schemas/ProjectRole'
        addedAt:
          type: string
          format: date-time

    MemberAddRequest:
      type: object
      required: [email]
      additionalProperties: false
      properties:
        email:
          type: string
          maxLength: 254
          description: Email of an active, non-Admin account (case-insensitive).
        projectRole:
          $ref: '#/components/schemas/ProjectRole'
          default: MEMBER

    MemberRoleRequest:
      type: object
      required: [projectRole]
      additionalProperties: false
      properties:
        projectRole:
          $ref: '#/components/schemas/ProjectRole'

    TaskCreateRequest:
      type: object
      required: [title]
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 150
          pattern: '^\s*\S.{1,148}\S\s*$'
          description: Mandatory. 3 to 150 characters after trimming; cannot be only spaces.
        description:
          type: [string, 'null']
          maxLength: 2000
          description: Optional. Up to 2,000 characters.
        status:
          $ref: '#/components/schemas/TaskStatus'
          default: TODO
        priority:
          $ref: '#/components/schemas/TaskPriority'
          default: MEDIUM
        dueDate:
          type: [string, 'null']
          format: date
          description: Optional; any date is accepted, past dates included (A19).
        assigneeIds:
          type: array
          uniqueItems: true
          default: []
          description: Optional. Ids of active members of the project; no duplicates (FR8).
          items:
            $ref: '#/components/schemas/Id'

    TaskUpdateRequest:
      type: object
      required: [version]
      minProperties: 2
      additionalProperties: false
      description: Partial update. At least one field besides `version`. Same rules as on creation.
      properties:
        version:
          type: integer
          minimum: 0
          description: The `version` of the task as last read by the client.
        title:
          type: string
          minLength: 3
          maxLength: 150
          pattern: '^\s*\S.{1,148}\S\s*$'
          description: 3 to 150 characters after trimming; cannot be only spaces. Cannot be set to null.
        description:
          type: [string, 'null']
          maxLength: 2000
          description: Up to 2,000 characters; null clears it.
        status:
          $ref: '#/components/schemas/TaskStatus'
        priority:
          $ref: '#/components/schemas/TaskPriority'
        dueDate:
          type: [string, 'null']
          format: date
          description: Any date; null clears it.
        assigneeIds:
          type: array
          uniqueItems: true
          description: Replaces the whole list. Ids of active members of the project; empty list removes all.
          items:
            $ref: '#/components/schemas/Id'

    Task:
      type: object
      required: [id, projectId, title, status, priority, assignees, createdBy, createdAt, updatedAt, version]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        projectId:
          $ref: '#/components/schemas/Id'
        title:
          type: string
          example: Fix login error message
        description:
          type: [string, 'null']
        status:
          $ref: '#/components/schemas/TaskStatus'
        priority:
          $ref: '#/components/schemas/TaskPriority'
        dueDate:
          type: [string, 'null']
          format: date
        assignees:
          type: array
          items:
            $ref: '#/components/schemas/UserSummary'
        createdBy:
          $ref: '#/components/schemas/UserSummary'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          description: Used for optimistic locking when the task is updated (D25).

    TaskPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Task'

    AssigneeAddRequest:
      type: object
      required: [userId]
      additionalProperties: false
      properties:
        userId:
          $ref: '#/components/schemas/Id'

    CommentCreateRequest:
      type: object
      required: [body]
      additionalProperties: false
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 2000
          pattern: '\S'
          description: Mandatory, plain text. 1 to 2,000 characters after trimming; cannot be only spaces.

    Comment:
      type: object
      required: [id, taskId, author, body, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        taskId:
          $ref: '#/components/schemas/Id'
        author:
          $ref: '#/components/schemas/UserSummary'
        body:
          type: string
        createdAt:
          type: string
          format: date-time
          description: Shown as the comment date (US7).

    Dashboard:
      type: object
      required: [totals, projects]
      properties:
        totals:
          type: object
          required: [projects, taskCounts]
          properties:
            projects:
              type: integer
              minimum: 0
            taskCounts:
              $ref: '#/components/schemas/TaskCounts'
        projects:
          type: array
          description: Empty when the user is not a member of any project (wireframe element 7).
          items:
            $ref: '#/components/schemas/ProjectSummary'

    Problem:
      type: object
      description: Problem Details (RFC 9457). Never contains stack traces or internal details (NFR5).
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
          example: about:blank
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
          description: Machine-readable reason for 409 responses; the frontend maps it to a message.
          enum: [VERSION_CONFLICT, ALREADY_MEMBER, ALREADY_ASSIGNED, LAST_MANAGER]

    ValidationProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [errors]
          properties:
            errors:
              type: array
              items:
                type: object
                required: [field, code]
                properties:
                  field:
                    type: string
                    example: title
                  code:
                    type: string
                    description: Machine-readable rule; the frontend maps it to a message in the user's language.
                    enum: [REQUIRED, TOO_SHORT, TOO_LONG, BLANK, INVALID_VALUE, INVALID_DATE, DUPLICATE, NOT_A_PROJECT_MEMBER, USER_NOT_ELIGIBLE]

  responses:
    BadRequest:
      description: Malformed request (invalid JSON, unknown field, non-numeric id). A wrong type or null is 422.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Bad Request
            status: 400
    Unauthorized:
      description: Not authenticated, session expired or account deactivated.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Unauthorized
            status: 401
    LoginFailed:
      description: Wrong email or password, deactivated account or locked account; the same answer in every case (D6, D7).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Unauthorized
            status: 401
            detail: Invalid email or password.
    Forbidden:
      description: Authenticated but not allowed for the account or project role (D9, D10, D11, D23), password change required at first login (D45), or missing CSRF token.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Forbidden
            status: 403
    NotFound:
      description: The resource does not exist or the user is not a member of its project (E4).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Not Found
            status: 404
    ValidationError:
      description: The data breaks a validation rule.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblem'
          examples:
            blankTitle:
              summary: Title made only of spaces
              value:
                type: about:blank
                title: Unprocessable Content
                status: 422
                errors:
                  - field: title
                    code: BLANK
            notMember:
              summary: Assignee is not an active project member
              value:
                type: about:blank
                title: Unprocessable Content
                status: 422
                errors:
                  - field: userId
                    code: NOT_A_PROJECT_MEMBER
            notEligible:
              summary: Member to add is not an active, non-Admin account
              value:
                type: about:blank
                title: Unprocessable Content
                status: 422
                errors:
                  - field: email
                    code: USER_NOT_ELIGIBLE
    Conflict:
      description: Conflicting state; `code` gives the reason (version conflict D25, already a member D13, already assigned D21, last Manager D16).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            versionConflict:
              summary: Changed by someone else; reload and try again
              value:
                type: about:blank
                title: Conflict
                status: 409
                code: VERSION_CONFLICT
            alreadyAssigned:
              summary: The user is already assigned to the task
              value:
                type: about:blank
                title: Conflict
                status: 409
                code: ALREADY_ASSIGNED
            lastManager:
              summary: The project must keep at least one Manager
              value:
                type: about:blank
                title: Conflict
                status: 409
                code: LAST_MANAGER
    UnsupportedMediaType:
      description: The request body is not application/json.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Unsupported Media Type
            status: 415
    InternalError:
      description: Unexpected error; nothing was saved (D28).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Internal Server Error
            status: 500
